<!doctype html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>テストアプリ</title>
</head>
<body>
  <h1>テストアプリ</h1>
  <input id="hobby" type="text" placeholder="趣味を入力（例：サッカー）">
<p>教材の写真を選んでください（最大5枚・合計10MBまで）。</p>
<input type="file" id="photo"
       accept="image/jpeg,image/png,image/gif,image/webp" multiple>
<div id="preview"></div>
<button type="button" id="generate">問題を作る</button>
<p id="question"></p>
  <script src="app.js"></script>
</body>
</html>
